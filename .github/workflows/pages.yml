name: Deploy Empresta Aí to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp empresta-ai-jhonnejefferson.html _site/index.html
          cp empresta-ai-jhonnejefferson.html _site/empresta-ai-jhonnejefferson.html
          cp -r mockups _site/mockups
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Wait for artifact propagation
        run: sleep 5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
